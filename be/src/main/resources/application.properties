spring.application.name=be-edua-system

# ---- Database (PostgreSQL via Docker) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:9118/edua_system}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
# Khong dung cac schema edua_*_it cua integration test khi khoi dong ung dung that.
# Co the doi schema deploy bang APP_DB_SCHEMA (mac dinh public).
spring.datasource.hikari.schema=${APP_DB_SCHEMA:public}

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=${APP_DB_SCHEMA:public}

# ---- Flyway ----
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=${APP_DB_SCHEMA:public}
spring.flyway.schemas=${APP_DB_SCHEMA:public}
spring.flyway.validate-on-migrate=false

# ---- AI providers ----
# Secrets are supplied by environment variables locally and in Coolify.

# OpenAI - vision-capable primary
app.ai.openai.api-key=${APP_AI_OPENAI_API_KEY:}
app.ai.openai.base-url=${APP_AI_OPENAI_BASE_URL:https://api.openai.com}
app.ai.openai.default-model=${APP_AI_OPENAI_DEFAULT_MODEL:gpt-4o-mini}

# DeepSeek (OpenAI-compatible) - text-only fallback
app.ai.deepseek.api-key=${APP_AI_DEEPSEEK_API_KEY:}
app.ai.deepseek.base-url=${APP_AI_DEEPSEEK_BASE_URL:https://api.deepseek.com}
app.ai.deepseek.default-model=${APP_AI_DEEPSEEK_DEFAULT_MODEL:deepseek-v4-flash}

# ---- Cloudflare R2 (S3-compatible) ----
# Secrets are supplied by environment variables locally and in Coolify.
app.r2.endpoint=${APP_R2_ENDPOINT:}
app.r2.access-key-id=${APP_R2_ACCESS_KEY_ID:}
app.r2.secret-access-key=${APP_R2_SECRET_ACCESS_KEY:}
app.r2.bucket=${APP_R2_BUCKET:edua}
app.r2.public-url=${APP_R2_PUBLIC_URL:}

# ---- Multipart (≤10MB theo BR-10) ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Auth (Google OAuth2 verify id_token + JWT nội bộ) ----
# Secrets qua environment variables (xem .env.example). KHÔNG commit giá trị thật.
app.auth.google.client-id=${APP_AUTH_GOOGLE_CLIENT_ID:}
app.auth.google.client-secret=${APP_AUTH_GOOGLE_CLIENT_SECRET:}
# JWT HS256 — sinh secret bằng: openssl rand -base64 48
app.auth.jwt.secret=${APP_AUTH_JWT_SECRET:}
app.auth.jwt.access-ttl=${APP_AUTH_JWT_ACCESS_TTL:PT60M}
app.auth.jwt.refresh-ttl=${APP_AUTH_JWT_REFRESH_TTL:PT24H}
# Cookie refresh: bật Secure ở prod (HTTPS).
app.auth.cookie.secure=${APP_AUTH_COOKIE_SECURE:false}
# Email principal seed lần đầu (PrincipalSeedRunner tạo dòng PRINCIPAL đầu tiên).
# APP_AUTH_ADMIN_SEED_EMAIL is kept as a local fallback for existing environments.
app.auth.principal-seed-email=${APP_AUTH_PRINCIPAL_SEED_EMAIL:${APP_AUTH_ADMIN_SEED_EMAIL:}}
# Rate limit (SEC-07)
app.auth.rate-limit.standard-per-minute=${APP_AUTH_RATE_STANDARD:60}
app.auth.rate-limit.ai-per-minute=${APP_AUTH_RATE_AI:10}

# ---- CORS ---- (dùng cookie refresh → origin cố định, prod đổi sang HTTPS)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
