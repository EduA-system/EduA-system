spring.application.name=be-edua-system

# ---- Database (PostgreSQL via Docker) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:9118/edua_system}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---- Flyway ----
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false

# ---- AI providers ----
# Secrets are supplied by environment variables locally and in Coolify.

# OpenAI - vision-capable primary
app.ai.openai.api-key=${APP_AI_OPENAI_API_KEY:}
app.ai.openai.base-url=${APP_AI_OPENAI_BASE_URL:https://api.openai.com}
app.ai.openai.default-model=${APP_AI_OPENAI_DEFAULT_MODEL:gpt-4o-mini}

# DeepSeek (OpenAI-compatible) - text-only fallback
app.ai.deepseek.api-key=${APP_AI_DEEPSEEK_API_KEY:}
app.ai.deepseek.base-url=${APP_AI_DEEPSEEK_BASE_URL:https://api.deepseek.com}
app.ai.deepseek.default-model=${APP_AI_DEEPSEEK_DEFAULT_MODEL:deepseek-v4-flash}

# ---- Cloudflare R2 (S3-compatible) ----
# Secrets are supplied by environment variables locally and in Coolify.
app.r2.endpoint=${APP_R2_ENDPOINT:}
app.r2.access-key-id=${APP_R2_ACCESS_KEY_ID:}
app.r2.secret-access-key=${APP_R2_SECRET_ACCESS_KEY:}
app.r2.bucket=${APP_R2_BUCKET:edua}
app.r2.public-url=${APP_R2_PUBLIC_URL:}

# ---- Multipart (≤10MB theo BR-10) ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
